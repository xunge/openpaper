# Containerized local dev stack — the environment an agent can restart, migrate,
# and wipe without touching the uncontainerized stack you run by hand.
#
# Drive it through `scripts/dev`, not raw `docker compose`: that script sets the
# published-port variables this file interpolates, and defaults are only correct
# when they are all set together.
#
# Service decomposition mirrors production (see ../open-paper-ci/ecs_definitions):
# app-service, jobs-api, jobs-worker, jobs-beat are separate processes there and
# separate containers here, with migrations as a one-shot run before the app
# boots rather than on every app container's start.
name: openpaper-dev

# Secrets and third-party keys are read from the same env files the
# uncontainerized stack uses — there is no second copy to keep in sync. Only the
# values that must differ inside the container network are overridden below.
x-jobs-service: &jobs-service
  build:
    context: ./jobs
  env_file: [jobs/.env]
  environment:
    # Both halves must agree on broker and vhost or tasks are published to a
    # queue nobody consumes. The checked-in envs disagree on the trailing slash
    # (server "/" vs jobs "//"), so both are pinned to the explicit "/" vhost.
    CELERY_BROKER_URL: pyamqp://guest:guest@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    # Webhooks land on the server over the compose network, not the host port.
    WEBHOOK_BASE_URL: http://server:8000
    LANGFUSE_TRACING_ENVIRONMENT: local-docker
    # MinerU runs on the host, not in this compose file. Inside a container
    # 127.0.0.1 is the worker itself, so reach the host gateway explicitly.
    MINERU_FILE_PARSE_URL: http://host.docker.internal:8003
    MINERU_TASKS_API_URL: http://host.docker.internal:8000
    MINERU_API_MODE: auto
    MINERU_TIER: standard
    MINERU_OCR_MODE: auto
    MINERU_PRESERVE_VISUAL_BLOCKS: "true"
    MINERU_VISUAL_BLOCK_TYPES: table,algorithm,code
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Only the source dirs are mounted, not ./jobs itself. Mounting the whole
    # directory would shadow the image's Linux virtualenv at /app/.venv with the
    # macOS one `uv sync` leaves on the host, and a volume to protect it can't
    # be shared: all three jobs services start at once and race to initialize
    # it. Adding a new top-level file under jobs/ needs `scripts/dev rebuild`.
    - ./jobs/src:/app/src
    - ./jobs/scripts:/app/scripts
  depends_on:
    rabbitmq: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: annotated-paper
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/seed:/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d annotated-paper"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    # Pinned to the exact version the uncontainerized stack runs. Newer 4.x
    # images disallow `transient_nonexcl_queues` by default, which is what
    # Celery declares — the worker then crash-loops with a 541 INTERNAL_ERROR
    # on connect. The local op-rabbitmq container predates that change and so
    # never hit it; a floating tag here would have made this stack diverge from
    # the one it is supposed to mirror.
    image: rabbitmq:4.1.2-management
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_UI_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Self-hosting substitute for the AWS + Cloudflare pair upstream stores PDFs
  # in. The console is published too so buckets and CORS are inspectable without
  # a shell in the container. `scripts/dev` creates the bucket and its CORS rule
  # on first boot; see the minio-bucket note in DEVELOPMENT.md.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Presigned URLs are minted against the endpoint the *server* uses. Inside
      # compose that is the service name, which the browser cannot resolve, so
      # the server is configured with the host address instead and this only
      # affects server-side redirects.
      MINIO_BROWSER_REDIRECT_URL: http://${DEV_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # The image ships `mc`, not curl; `mc ready` is the supported probe.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Local Qwen3-TTS behind an OpenAI-compatible /v1/audio/speech endpoint.
  # The GPU comes in through the nvidia container runtime (`gpus: all`), which
  # injects the driver libraries itself — no device nodes or host lib mounts.
  tts:
    build:
      context: ./docker/tts
    gpus: all
    environment:
      QWEN_TTS_MODEL: /models/Qwen3-TTS-12Hz-1.7B-CustomVoice
      QWEN_TTS_DEVICE: cuda:0
      QWEN_TTS_SPEAKER: ${TTS_SPEAKER:-Serena}
    volumes:
      - ${TTS_MODELS_DIR:-/home/jiang/models/qwen3-tts}:/models:ro
    ports:
      - "${TTS_PORT:-8102}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 300s
    restart: unless-stopped

  # vLLM-Omni serving the same Qwen3-TTS checkpoint. Kept side by side with the
  # `tts` service so the two can be compared on identical text before the app is
  # pointed at either one.
  tts-vllm:
    # Official vLLM-Omni image (vllm 0.30.0 + vllm_omni 0.30.0). Building the
    # pair from PyPI is what the earlier attempt did and it never finished
    # downloading; the image is the supported artifact.
    image: vllm/vllm-omni:v0.30.0
    command:
      - vllm
      - serve
      - /models/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - --omni
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # Without this the served id is the container path (/models/...), and the
      # app would have to embed that path in its own config.
      - --served-model-name
      - Qwen3-TTS-12Hz-1.7B-CustomVoice
      - --gpu-memory-utilization
      - "0.35"
      # First start builds the talker's CUDA graphs; give it room.
      - --stage-init-timeout
      - "900"
      # Lets the idle watchdog put the engine to sleep: weights are offloaded to
      # host RAM and the KV cache dropped, freeing the GPU without a cold start.
      - --enable-sleep-mode
    gpus: all
    environment:
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      HF_HUB_OFFLINE: "1"
      # /sleep and /wake_up are exposed only in server dev mode.
      VLLM_SERVER_DEV_MODE: "1"
    volumes:
      - ${TTS_MODELS_DIR:-/home/jiang/models/qwen3-tts}:/models:ro
    ports:
      # Only the proxy needs to reach this port; binding it to loopback keeps
      # the dev endpoints (/sleep, /resume) off the LAN. Takes effect on the
      # next recreate — a restart costs a full engine warm-up.
      - "127.0.0.1:${VLLM_TTS_PORT:-8103}:8000"
    restart: unless-stopped
    # Model load takes minutes; the health endpoint answers once the engine is up.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 60
      start_period: 600s

  # Sits in front of tts-vllm and owns its power state: no traffic for
  # TTS_IDLE_SECONDS releases the GPU, the next request wakes it again.
  tts-proxy:
    build:
      context: ./docker/tts-proxy
    environment:
      TTS_UPSTREAM: http://tts-vllm:8000
      TTS_IDLE_SECONDS: "${TTS_IDLE_SECONDS:-300}"
      TTS_STAGES: "0,1"
    ports:
      - "${TTS_PROXY_PORT:-8104}:8000"
    depends_on:
      - tts-vllm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # One-shot, exactly as prod does it. `server` waits for this to exit 0, so a
  # failed migration surfaces as a failed startup instead of a half-migrated db.
  migrate:
    build:
      context: ./server
    command: ["python", "app/scripts/run_migrations.py"]
    env_file: [server/.env]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/annotated-paper
    volumes:
      - ./server:/app
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  server:
    build:
      context: ./server
    # python -m app.main runs uvicorn directly (readable single-process logs),
    # where prod runs gunicorn.
    command: ["python3", "-m", "app.main"]
    env_file: [server/.env]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/annotated-paper
      CELERY_BROKER_URL: pyamqp://guest:guest@rabbitmq:5672//
      # No CELERY_RESULT_BACKEND here on purpose. server/.env leaves it unset
      # and the server image has no redis package, so setting it makes every
      # task submission fail with "No module named 'redis'". Only the jobs
      # services, which do ship redis, get a result backend.
      CELERY_API_URL: http://jobs-api:8001
      # Read by the SERVER, not just by jobs: the server builds the callback URL
      # it hands to each Celery task, and the worker is what dials it. So this
      # has to be the compose-network address, never the host-published port —
      # localhost inside the worker container is the worker itself.
      WEBHOOK_BASE_URL: http://server:8000
      # CORS allows exactly one origin, so this must be the *host-published*
      # client port — it is compared against the browser's Origin header.
      CLIENT_DOMAIN: http://${DEV_HOST:-127.0.0.1}:${CLIENT_PORT:-3100}
      API_DOMAIN: http://${DEV_HOST:-127.0.0.1}:${SERVER_PORT:-8100}
      # Browsers keep separate cookie jars for `localhost` and `127.0.0.1`, and
      # cookies ignore ports. Without this split, a session_token set by the
      # uncontainerized stack on :3000 is also sent to :3100/:8100 — and since
      # the server marks it httponly, JavaScript cannot replace it, so you get
      # 401s you cannot clear from the page. Different host, different jar.
      # Cookies ignore ports, and this stack's default host is an IP literal,
      # which browsers reject as a cookie Domain. Empty means "host-only",
      # which is what uncontainerized dev gets too. Set it explicitly when
      # running behind a real domain name.
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      # Browser OAuth against these ports only works if the redirect URIs are
      # registered with the provider. Use `scripts/dev session` instead.
      GOOGLE_REDIRECT_URI: http://${DEV_HOST:-127.0.0.1}:${SERVER_PORT:-8100}/api/auth/google/callback
      ZOTERO_REDIRECT_URI: http://${DEV_HOST:-127.0.0.1}:${SERVER_PORT:-8100}/api/auth/zotero/callback
      LANGFUSE_TRACING_ENVIRONMENT: local-docker
      # The server probes MinerU for availability too, so it needs the same
      # host-gateway address as the worker (MinerU itself is not in compose).
      MINERU_FILE_PARSE_URL: http://host.docker.internal:8003
      MINERU_TASKS_API_URL: http://host.docker.internal:8000
      DEBUG: "True"
      # Autoreload. server/ is bind-mounted, so edits are live in the container
      # immediately — but the uvicorn process keeps whatever it imported at
      # start. Without this, anything exercised through the HTTP API runs stale
      # code until `scripts/dev restart server`, while `scripts/dev exec` spawns
      # a fresh process and looks perfectly fine. That asymmetry is a
      # verification trap, not a convenience problem: an agent can watch tests
      # pass against code the running app is not serving.
      #
      # It works over the bind mount only because watchfiles is not installed,
      # so uvicorn falls back to StatReload and polls mtimes. inotify events do
      # not cross a macOS bind mount, so the faster watcher would see nothing.
      UVICORN_RELOAD: "True"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8100}:8000"
    volumes:
      - ./server:/app
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/docs').status==200 else 1)\""]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  jobs-api:
    <<: *jobs-service
    command: ["./scripts/start_api.sh"]
    ports:
      - "${JOBS_PORT:-8101}:8001"

  jobs-worker:
    <<: *jobs-service
    command: ["./scripts/start_worker.sh"]
    # The image's HEALTHCHECK curls the jobs API port, which only jobs-api
    # serves; left on, the worker and beat would report permanently unhealthy.
    healthcheck:
      disable: true

  jobs-beat:
    <<: *jobs-service
    command: ["./scripts/start_beat.sh"]
    healthcheck:
      disable: true

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    command: ["yarn", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    env_file: [client/.env.local]
    environment:
      # NEXT_PUBLIC_* is inlined into browser JS, so this is the host-published
      # server port — a compose service name would not resolve in the browser.
      # Empty on purpose: the browser uses relative /api URLs and Next proxies
      # them to API_INTERNAL_URL, so cookies stay first-party.
      NEXT_PUBLIC_API_URL: ""
      API_INTERNAL_URL: http://server:8000
      # Keep the browser-side size gate in step with MAX_UPLOAD_SIZE_MB.
      NEXT_PUBLIC_MAX_UPLOAD_MB: "200"
      # Bind-mounted source over virtiofs drops inotify events; without polling
      # edits land on disk but never trigger a rebuild.
      WATCHPACK_POLLING: "true"
    ports:
      - "${CLIENT_PORT:-3100}:3000"
    volumes:
      - ./client:/app
      # Host node_modules holds darwin binaries, and a shared .next is what
      # corrupts the uncontainerized dev server. Both stay container-local.
      # Anonymous rather than named on purpose: `rebuild` refreshes them with
      # --renew-anon-volumes, which has no effect on named volumes.
      - /app/node_modules
      - /app/.next
    depends_on:
      server: {condition: service_started}
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
